<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pasindu's Todo 🔥</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;min-height:100vh;display:flex;justify-content:center;padding-top:60px;color:white}.card{background:#1e293b;padding:32px;border-radius:20px;width:90%;max-width:500px;box-shadow:0 20px 40px rgba(0,0,0,.4)}h1{font-size:28px;margin-bottom:16px;text-align:center}.stats{display:flex;gap:10px;margin-bottom:20px}.stat{flex:1;background:#0f172a;border:1px solid #334155;padding:12px;border-radius:12px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:11px;opacity:.6;text-transform:uppercase}.stat.done{border-color:#22c55e}.stat.pending{border-color:#f59e0b}.input-row{display:flex;gap:12px;margin-bottom:20px}input{flex:1;background:#0f172a;border:1px solid #334155;padding:14px 16px;border-radius:12px;color:white;outline:none}button{background:white;color:#0f172a;border:none;padding:14px 22px;border-radius:12px;font-weight:700;cursor:pointer}.task{background:#0f172a;border:1px solid #334155;padding:14px 16px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.task.done-task{background:#14532d;border-color:#22c55e}.task span{flex:1;cursor:pointer}.task span.done{text-decoration:line-through;color:#86efac}.actions{display:flex;gap:8px}.actions button{padding:6px 12px;font-size:13px;border-radius:8px}.del{background:#ef4444;color:white}.ok{background:#22c55e;color:white}</style></head><body><div class="card"><h1>Pasindu's Todo 🔥</h1>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total Tasks</span></div><div class="stat done"><b id="done">0</b><span>Complete</span></div><div class="stat pending"><b id="pending">0</b><span>Ithuru</span></div></div>
<div class="input-row"><input id="taskInput" placeholder="Aluth task ekak..."><button onclick="addTask()">Add</button></div><div id="list"></div><p id="status" style="text-align:center;margin-top:16px;opacity:.5;font-size:12px"></p></div><script>
const API='http://localhost:8080/api/todos';let useLocal=false;let tasks=JSON.parse(localStorage.getItem('pasindu-tasks')||'[]');
async function load(){try{const r=await fetch(API);if(!r.ok)throw'';tasks=await r.json();useLocal=false;status.innerText='🟢 Live Backend';}catch(e){useLocal=true;tasks=JSON.parse(localStorage.getItem('pasindu-tasks')||'[]');status.innerText='🟡 Demo Mode (Local Storage) - CV Ready';}render();}
function render(){const list=document.getElementById('list');list.innerHTML='';let doneCount=0;tasks.forEach((t,i)=>{const text=t.text||t.task||t;const done=t.completed||false;if(done)doneCount++;const d=document.createElement('div');d.className='task'+(done?' done-task':'');d.innerHTML=`<span class="${done?'done':''}" onclick="toggle(${i})">${text}</span><div class="actions"><button class="${done?'':'ok'}" onclick="toggle(${i})">${done?'↩':'✓'}</button><button class="del" onclick="removeTask(${i})">X</button></div>`;list.appendChild(d);});document.getElementById('total').innerText=tasks.length;document.getElementById('done').innerText=doneCount;document.getElementById('pending').innerText=tasks.length-doneCount;}
async function addTask(){const inp=document.getElementById('taskInput');const text=inp.value.trim();if(!text)return;if(useLocal){tasks.push({text,completed:false});localStorage.setItem('pasindu-tasks',JSON.stringify(tasks));inp.value='';render();return;}await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:text})});inp.value='';load();}
async function removeTask(i){if(useLocal){tasks.splice(i,1);localStorage.setItem('pasindu-tasks',JSON.stringify(tasks));render();return;}await fetch(API+'/'+tasks[i].id,{method:'DELETE'});load();}
function toggle(i){tasks[i].completed=!tasks[i].completed;if(useLocal){localStorage.setItem('pasindu-tasks',JSON.stringify(tasks));render();}}
document.getElementById('taskInput').addEventListener('keypress',e=>{if(e.key==='Enter')addTask()});load();
</script></body></html>
