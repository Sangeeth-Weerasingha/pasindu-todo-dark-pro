<!DOCTYPE html>
<html>
<head>
<title>Pasindu's Todo Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:Arial;max-width:520px;margin:40px auto;background:#0f172a;padding:15px;color:white}
.card{background:#1e293b;padding:28px;border-radius:20px;box-shadow:0 20px 40px #0005;border:1px solid #334155}
h1{margin:0 0 20px 0;color:white}
.row{display:flex;gap:10px}
#taskInput{flex:1;padding:14px;border-radius:12px;border:1px solid #334155;outline:none;font-size:15px;background:#0f172a;color:white}
.btn{padding:14px 20px;border-radius:12px;border:none;background:white;color:black;cursor:pointer;font-weight:700}
.btn:active{transform:scale(.95)}
li{margin:12px 0;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;list-style:none;transition:.3s;border-left:5px solid transparent}
li.pending{background:#334155;border-left-color:#60a5fa;color:white}
li.done{background:#14532d;border-left-color:#22c55e;color:#bbf7d0}
li.done span{text-decoration:line-through;color:#86efac}
li span{flex:1;font-size:16px;font-weight:500;text-align:left;padding-left:10px}
li input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:#22c55e}
.del{background:#ef4444;color:white;padding:10px 16px;border-radius:10px}
.small{color:#94a3b8;font-size:13px;margin-top:15px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>Pasindu's Todo 🔥</h1>
<div class="row">
<input id="taskInput" placeholder="Aluth task ekak...">
<button class="btn" onclick="addTask()">Add</button>
</div>
<ul id="list" style="padding:0;margin-top:20px"></ul>
<div class="small" id="count"></div>
</div>
<script>
const API = 'http://localhost:8080/api/tasks';
async function load(){
 let r=await fetch(API); let tasks=await r.json();
 document.getElementById('list').innerHTML=tasks.map(t=>`
  <li class="${t.completed?'done':'pending'}">
   <input type="checkbox" ${t.completed?'checked':''} onchange="toggle(${t.id},${t.completed})">
   <span>${t.text}</span>
   <button class="btn del" onclick="del(${t.id})">X</button>
  </li>`).join('');
 document.getElementById('count').innerText = tasks.length + ' tasks | ' + tasks.filter(x=>x.completed).length + ' done';
}
async function addTask(){
 let text=document.getElementById('taskInput').value.trim();
 if(!text) return;
 await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
 document.getElementById('taskInput').value=''; load();
}
async function del(id){ await fetch(API+'/'+id,{method:'DELETE'}); load(); }
async function toggle(id,current){
 await fetch(API+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:!current})});
 load();
}
document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});
load();
</script>
</body>
</html>
